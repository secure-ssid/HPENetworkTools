# Every check this repo already has, run automatically.
#
# The suite (1,700+ tests) is the safety net for the plane adapters and the
# write brokers, and it was previously only ever run by hand. Typecheck, tests
# and build run as separate steps so a failure names which one broke rather
# than collapsing into one red X.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a drifted
      # lockfile fails here rather than silently resolving to other versions.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs after typecheck because the type-aware rules
      # (no-floating-promises, no-misused-promises) need a clean program to be
      # meaningful. Warnings are allowed through; only errors fail the build.
      - name: Lint
        run: npm run lint

      - name: Server tests
        run: npm run test -w server

      - name: Web tests
        run: npm run test -w web

      # The portal formats dates and buckets "today" on whichever clock the
      # reader is on, and several bugs have come from a value bucketed on one
      # machine and displayed on another. Those are invisible in UTC, which is
      # exactly where CI runs: eight tests in configureStats passed on every
      # machine this suite had ever seen and failed the moment the host moved
      # west of Greenwich, because they built their fixtures from a UTC
      # calendar day and asserted against local-day logic.
      #
      # So the suites run again at the two extremes. UTC+14 and UTC-10 are a
      # full day apart, which means any test that quietly assumes the host's
      # calendar day matches Greenwich's disagrees with itself in at least one
      # of them. This costs about thirty seconds and is the only way this class
      # of defect fails loudly rather than on someone else's laptop.
      - name: Tests at UTC+14
        run: npm run test -w server && npm run test -w web
        env:
          TZ: Pacific/Kiritimati

      - name: Tests at UTC-10
        run: npm run test -w server && npm run test -w web
        env:
          TZ: Pacific/Honolulu

      - name: Build web
        run: npm run build -w web
